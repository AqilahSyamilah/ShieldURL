<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account Verification Test Page</title>
</head>
<body>
  <h1>Account verification</h1>
  <p>Please sign in to verify your account and payment profile.</p>
  <form method="post" action="https://example.net/session-check">
    <label>
      Email
      <input type="email" name="email" autocomplete="email">
    </label>
    <label>
      Password
      <input type="password" name="password" autocomplete="current-password">
    </label>
    <button type="submit">Sign in</button>
  </form>
</body>
</html>
